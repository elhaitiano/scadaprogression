services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: .env.local
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  
  backend:
    build: ./backend
    env_file: .env.local
    volumes:
      - ./backend:/app
    ports: 
      - "8484:8484"
    depends_on:
      db:
        condition: service_healthy
    
  frontend:
    build: ./frontend
    environment:
      WATCHPACK_POLLING: "true"
    # env_file: .env.local
    volumes:
      - ./frontend:/app
      - frontend_next:/app/.next
      # - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
  
volumes:
  mysql_data:
  frontend_next:
